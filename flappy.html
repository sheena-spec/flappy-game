<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Jeny Bird.io</title>
<style>
  body {
    margin: 0;
    background: #70c5ce;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
  }
  canvas {
    display: block;
    margin: auto;
    background: #70c5ce;
  }

  /* Popup style */
  #scorePopup {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #ffc0cb, #ffb6c1); /* cute pink gradient */
    border: 3px solid #ff69b4; /* darker pink border */
    padding: 40px 60px;
    text-align: center;
    font-size: 22px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(255, 182, 193, 0.5); /* soft pink shadow */
    animation: popIn 0.5s ease-out;
  }
  #scorePopup span {
    font-size: 28px;
    display: block;
    margin-bottom: 10px;
  }

  @keyframes popIn {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }

  /* Button inside popup */
  #goLetterBtn {
    margin-top: 15px;
    padding: 10px 20px;
    font-size: 18px;
    background: linear-gradient(135deg, #ffb6c1, #ff69b4);
    color: white;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(255,105,180,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  #goLetterBtn:hover {
    transform: scale(1.05);
    box-shadow: 0 7px 20px rgba(255,105,180,0.6);
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<!-- Popup message -->
<div id="scorePopup">
  <span>🎉 yey! congrats, bebi! 🎉</span>
  <p>you've reached score 7!</p>
  <button id="goLetterBtn">see your special message ^^</button>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Bird image
const birdImg = new Image();
birdImg.src = "bird.png";

// Bird setup
const bird = {
  x: 80, y: 300,
  width: 50, height: 50,
  hitBoxWidth: 20, hitBoxHeight: 25,
  hitBoxOffsetX: 15, hitBoxOffsetY: 10,
  velocity: 0, gravity: 0.35, lift: -6.5,
};

// Pipes
let pipes = [];
let frame = 0;
let score = 0;
let gameOver = false;

// Clouds
let clouds = [
  { x: 50, y: 50, speed: 0.5 },
  { x: 200, y: 100, speed: 0.3 },
  { x: 350, y: 70, speed: 0.4 }
];

// Mountains
let mountains = [
  { x: 0, y: 400, width: 400, height: 200, speed: 0.2 },
  { x: 400, y: 400, width: 400, height: 200, speed: 0.2 }
];

// Popup
const popup = document.getElementById("scorePopup");
const goLetterBtn = document.getElementById("goLetterBtn");
let popupShown = false;
let paused = false;

function drawBackground() {
  // Mountains
  ctx.fillStyle = "#7B6F5A";
  mountains.forEach(m => {
    ctx.beginPath();
    ctx.moveTo(m.x, canvas.height);
    ctx.lineTo(m.x + m.width/2, m.y);
    ctx.lineTo(m.x + m.width, canvas.height);
    ctx.closePath();
    ctx.fill();
    m.x -= m.speed;
    if(m.x <= -m.width) m.x = canvas.width;
  });
  
  // Clouds
  ctx.fillStyle = "white";
  clouds.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, 20, 0, Math.PI*2);
    ctx.arc(c.x+25, c.y+10, 25, 0, Math.PI*2);
    ctx.arc(c.x+50, c.y, 20, 0, Math.PI*2);
    ctx.fill();
    c.x -= c.speed;
    if(c.x <= -60) c.x = canvas.width;
  });
}

function drawBird() {
  const angle = Math.min(Math.max(bird.velocity*0.1, -0.5), 0.5);
  ctx.save();
  ctx.translate(bird.x + bird.width/2, bird.y + bird.height/2);
  ctx.rotate(angle);
  ctx.drawImage(birdImg, -bird.width/2, -bird.height/2, bird.width, bird.height);
  ctx.restore();
}

function drawPipes() {
  ctx.fillStyle = "green";
  pipes.forEach(pipe => {
    ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
    ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipe.width, pipe.bottom);
  });
}

function updateBird() {
  bird.velocity += bird.gravity;
  bird.y += bird.velocity;
  if(bird.y + bird.height/2 > canvas.height){ bird.y = canvas.height - bird.height/2; bird.velocity = 0; gameOver = true; }
  if(bird.y - bird.height/2 < 0){ bird.y = bird.height/2; bird.velocity = 0; }
}

function updatePipes() {
  if(frame % 90 === 0){
    const minGap = 170, maxGap = 230;
    const gap = Math.random() * (maxGap - minGap) + minGap;
    const top = Math.random()*(canvas.height-gap-100)+50;
    pipes.push({x: canvas.width, width: 50, top: top, bottom: canvas.height-top-gap});
  }
  pipes.forEach(pipe => pipe.x -= 2);
  pipes = pipes.filter(pipe => pipe.x + pipe.width > 0);
}

function detectCollision() {
  for(let pipe of pipes){
    const birdLeft = bird.x - bird.hitBoxWidth/2 + bird.hitBoxOffsetX;
    const birdRight = bird.x + bird.hitBoxWidth/2 - bird.hitBoxOffsetX;
    const birdTop = bird.y - bird.hitBoxHeight/2 + bird.hitBoxOffsetY;
    const birdBottom = bird.y + bird.hitBoxHeight/2 - bird.hitBoxOffsetY;
    if(birdRight > pipe.x && birdLeft < pipe.x + pipe.width && (birdTop < pipe.top || birdBottom > canvas.height - pipe.bottom)){
      gameOver = true;
    }
  }
}

function drawScore(){
  ctx.fillStyle = "white";
  ctx.font = "24px Arial";
  ctx.fillText(`Score: ${score}`, 10, 30);
}

function gameLoop(){
  if(paused) return; // Stop the game if paused

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  drawBird();
  drawPipes();
  drawScore();

  if(!gameOver){
    updateBird();
    updatePipes();
    detectCollision();
    pipes.forEach(pipe => { if(pipe.x + pipe.width === Math.floor(bird.x)) score++; });

    // Show popup when score reaches 7
    if(score >= 7 && !popupShown){
      popup.style.display = "block";
      popupShown = true;
      paused = true; // Pause the game
    }

    frame++;
    requestAnimationFrame(gameLoop);
  } else {
    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.fillText("Game Over", 100, 300);
    ctx.font = "20px Arial";
    ctx.fillText("Click or tap to restart", 115, 340);
  }
}

function jump(){
  if(!gameOver && !paused) bird.velocity = bird.lift;
  else if(gameOver) resetGame();
}

function resetGame(){
  bird.y = 300;
  bird.velocity = 0;
  pipes = [];
  frame = 0;
  score = 0;
  gameOver = false;
  popup.style.display = "none";
  popupShown = false;
  paused = false;
  gameLoop();
}

document.addEventListener("mousedown", jump);
document.addEventListener("touchstart", jump);

// Redirect to letter page when button clicked
goLetterBtn.addEventListener("click", () => {
  window.location.href = "letter.html";
});

// Start after bird image loads
birdImg.onload = () => gameLoop();
</script>
</body>
</html>
